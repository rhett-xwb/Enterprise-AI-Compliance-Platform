server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: compliance-platform
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/compliance_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=false&useSSL=true}
    username: ${DB_USERNAME:compliance_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
logging:
  level:
    root: INFO
    com.enterprise.compliance: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:logs/compliance-platform.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
app:
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:false}
    username: ${BOOTSTRAP_USERNAME:bootstrap-admin}
    password: ${BOOTSTRAP_PASSWORD:}
